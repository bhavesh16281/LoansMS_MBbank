server:
  port: 8090

spring:
  application:
    name: loans
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3309/loansDB
    username: root
    password: root
    # initialization-mode: always
  jpa:
    # hibernate:
    #   ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "configserver:http://${CONFIG_SERVER_URL:localhost:8071}/"
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  #   username: guest
  #   password: guest
  cloud:
    bus:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"