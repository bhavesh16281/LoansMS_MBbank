server:
  port: 8090

spring:
  application:
    name: loans
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3309/loansdb
    username: root
    password: root
    # initialization-mode: always
  jpa:
    # hibernate:
    #   ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "configserver:http://${CONFIG_SERVER_URL:localhost:8071}/"
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  #   username: guest
  #   password: guest
  cloud:
    bus:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      # enabled: true
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
endpoints:
  shutdown:
    enabled: true
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: loans
    description: Loans Microservice
    version: 1.0.0

logging:
  level:
    com:
      bhavesh16281:
        loans: DEBUG
  pattern:
    level: "%5p[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"